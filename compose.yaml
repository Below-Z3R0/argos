# Argos en Docker: Qdrant + argosd + argos-mcp.
#
# La imagen se publica en GHCR desde CI: el usuario no compila. El CLI
# elige la variante según el hardware y pasa el tag en IMAGE.
#
#   IMAGE=intel-latest docker compose up -d
#
# Los overrides se aplican según la variante:
#   cuda  → compose.gpu.yml   (reserva NVIDIA)
#   intel → compose.dri.yml  (monta /dev/dri)
#   amd   → compose.dri.yml
#   cpu   → ninguno
#
# Los modelos NO están en la imagen: viven en el estado compartido y se
# instalan una vez con el CTL del servicio.
#
# El estado se bind-montea desde el host para que el CLI nativo y los
# contenedores hablen del mismo sitio: una sola copia de modelos, bases y
# manifiestos. El uid del host (1000) es el del usuario `argos` de la imagen.
#
# El vault se monta en la MISMA ruta absoluta que en el host porque
# `dbs/<nombre>/meta.json` guarda la ruta del corpus tal cual: si difiere, el
# indexado dentro del contenedor no encuentra la fuente.

name: argos

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: argos-qdrant
    restart: unless-stopped
    volumes:
      - argos-qdrant:/qdrant/storage
      - argos-qdrant-snapshots:/qdrant/snapshots
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  argosd:
    image: ghcr.io/below-z3r0/argos:${IMAGE:-intel-latest}
    container_name: argosd
    restart: unless-stopped
    command: ["argosd", "--addr", "0.0.0.0:7712"]
    environment:
      ARGOS_QDRANT_URL: qdrant:6334
      ARGOS_LOG_LEVEL: info
      ARGOS_HOME: ${ARGOS_HOME:-${HOME}/.local/share/argos}
      ARGOS_VAULT: ${VAULT_PATH:-${HOME}/Documents/Knowledge}
    volumes:
      # Estado compartido: la misma ruta absoluta dentro y fuera, para que el
      # config del host (paths.home, paths.vault) apunte al mismo sitio.
      - ${ARGOS_HOME:-${HOME}/.local/share/argos}:${ARGOS_HOME:-${HOME}/.local/share/argos}
      - ${HOME}/.config/argos:/home/argos/.config/argos
      - ${VAULT_PATH:-${HOME}/Documents/Knowledge}:${VAULT_PATH:-${HOME}/Documents/Knowledge}:ro
    ports:
      - "127.0.0.1:7712:7712"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7712/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # SIGTERM has 30 s to finish in-flight searches; exiting frees the models.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  argos-mcp:
    image: ghcr.io/below-z3r0/argos:${IMAGE:-intel-latest}
    container_name: argos-mcp
    restart: unless-stopped
    command:
      - argos-mcp
      - --argosctl=/usr/local/bin/argosctl
      - --argosd=http://argosd:7712
      - --addr=0.0.0.0:7711
    environment:
      ARGOS_QDRANT_URL: qdrant:6334
      ARGOS_VAULT: ${VAULT_PATH:-${HOME}/Documents/Knowledge}
      ARGOS_SERVICE_URL: http://argosd:7712
      ARGOS_HOME: ${ARGOS_HOME:-${HOME}/.local/share/argos}
    volumes:
      - ${ARGOS_HOME:-${HOME}/.local/share/argos}:${ARGOS_HOME:-${HOME}/.local/share/argos}
      - ${HOME}/.config/argos:/home/argos/.config/argos
      - ${VAULT_PATH:-${HOME}/Documents/Knowledge}:${VAULT_PATH:-${HOME}/Documents/Knowledge}:ro
    ports:
      - "127.0.0.1:7711:7711"
    depends_on:
      argosd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7711/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Parser por layout para PDFs complejos (columnas, tablas, escaneos).
  # No arranca salvo que se pida: docker compose --profile layout up -d
  # Costo: ~2 GB de RAM y ~4 GB de imagen.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.37.0
    container_name: argos-docling
    profiles: ["layout"]
    restart: unless-stopped
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    volumes:
      # Cache de layout: es del servicio, no del estado de Argos. Named volume
      # para no dejar archivos root-owned en el home del host.
      - argos-docling:/var/lib/docling
    ports:
      - "127.0.0.1:5001:5001"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  argos-docling:
  argos-qdrant:
  argos-qdrant-snapshots:
