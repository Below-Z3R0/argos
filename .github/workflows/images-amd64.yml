name: images-amd64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu, intel, amd]
    steps:
      - uses: actions/checkout@v4

      # The ORT source build needs more than the default 14 GB on a clean
      # runner. This frees the preinstalled toolchains we do not use.
      - uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile
          target: runtime-${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            ORT_FLAVOR=${{ matrix.variant == 'gpu' && 'gpu' || 'cpu' }}
          tags: |
            ghcr.io/below-z3r0/argos:${{ matrix.variant }}-${{ github.sha }}
            ghcr.io/below-z3r0/argos:${{ matrix.variant }}-latest
          cache-from: type=registry,ref=ghcr.io/below-z3r0/argos:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/below-z3r0/argos:buildcache-${{ matrix.variant }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Below-Z3R0/argos
            org.opencontainers.image.revision=${{ github.sha }}
