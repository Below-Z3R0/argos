name: app

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON array de variantes'
        required: true
        default: '["cpu","cuda","intel","amd"]'

concurrency:
  group: argos-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  app:
    name: app-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build metadata
        id: meta
        run: |
          version="$(git describe --tags --always 2>/dev/null || echo "${GITHUB_SHA:0:7}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/below-z3r0/b3l0w-ort:${{ matrix.variant }}-1.31
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/below-z3r0/argos:${{ matrix.variant }}-${{ github.sha }}
            ghcr.io/below-z3r0/argos:${{ matrix.variant }}-latest
          labels: |
            org.opencontainers.image.source=https://github.com/Below-Z3R0/argos
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test
        run: |
          out=$(docker run --rm ghcr.io/below-z3r0/argos:${{ matrix.variant }}-${{ github.sha }} argosctl version)
          echo "$out"
          case "$out" in
            *"commit none"*) echo "::error::la imagen se construyó sin metadatos de build"; exit 1 ;;
          esac
