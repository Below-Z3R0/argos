name: images-arm64

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cpu:
    name: cpu arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@v2
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU arm64
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile
          target: runtime-cpu
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/below-z3r0/argos:cpu-arm64-${{ github.sha }}
            ghcr.io/below-z3r0/argos:cpu-arm64-latest
          cache-from: type=registry,ref=ghcr.io/below-z3r0/argos:buildcache-cpu-arm64
          cache-to: type=registry,ref=ghcr.io/below-z3r0/argos:buildcache-cpu-arm64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Below-Z3R0/argos
            org.opencontainers.image.revision=${{ github.sha }}
